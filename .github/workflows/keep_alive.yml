name: Keep Streamlit App Awake

on:
  schedule:
    # Runs every 2 days at midnight UTC
    - cron: "0 0 */2 * *"
  workflow_dispatch: # Allows manual triggering from GitHub UI

jobs:
  ping-app:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit URL
        run: |
          curl -s -o /dev/null -w "%{http_code}" https://stock-market-ticker-personal-india.streamlit.app/
